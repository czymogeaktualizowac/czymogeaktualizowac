# Door 1 pipeline: watch -> lab (one job per new release) -> publish (+ alert drafts).
# Runs on GitHub-hosted runners; free and unlimited for public repositories (verify current terms).
# Actions are pinned to commit SHAs (version in the trailing comment); bump SHA and comment together.
# Phase 0 TODO before going live: create the `sandbox` environment (deployments from main only,
# holds sandbox-only secrets).
name: pipeline

on:
  schedule:
    - cron: "17 4,16 * * *"   # twice a day
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also process the N previous releases of every plugin (history)"
        default: "0"
      retest:
        description: "Re-run the lab for the latest release of these plugins even if tested (comma-separated slugs, or all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # pushes the data branch
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the data branch (git is the database)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add data origin/data
          else
            git worktree add --orphan -b data data
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - name: Watch WordPress.org
        run: java -jar app/target/czymogeaktualizowac.jar watch --backfill "${{ github.event.inputs.backfill || '0' }}"
      - name: Commit data
        run: |
          cd data
          git config user.name "czymogeaktualizowac bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: watch $(date -u +%FT%TZ)"
          git push origin HEAD:data
      # Lab queue: every known stable release without a lab result yet. This covers new releases, the first-run
      # baseline and backfilled history alike (the watcher reports only new releases as "changes", for alerts).
      # Newest release of each plugin first; capped per run, the rest is picked up by the next runs.
      # The `retest` input adds the latest release of the named plugins again, run with --force.
      - id: matrix
        env:
          LAB_QUEUE_CAP: "40"
          RETEST: ${{ github.event.inputs.retest || '' }}
        run: |
          RETEST_JSON=$(jq -cn --arg r "$RETEST" '$r | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          UNKNOWN=$(jq -r --argjson rt "$RETEST_JSON" '[.plugins[].slug] as $known | $rt - $known - ["all"] | join(",")' data/releases.json)
          if [ -n "$UNKNOWN" ]; then echo "::error::retest: unknown plugin slug(s): $UNKNOWN"; exit 1; fi
          jq -r --argjson rt "$RETEST_JSON" '.plugins[] | .slug as $s | .releases | map(select(.prerelease | not)) | to_entries[]
                 | "\(.key)\t\($s)\t\(.value.version)\t\(if .key == 0 and ($rt | any(. == "all" or . == $s)) then 1 else 0 end)"' data/releases.json \
            | sort -s -n -k1,1 \
            | while IFS=$'\t' read -r rank slug version force; do
                if [ "$force" = 1 ] || [ ! -f "data/results/$slug/$version.json" ]; then
                  jq -cn --arg s "$slug" --arg v "$version" --argjson f "$force" '{slug: $s, version: $v, force: ($f == 1)}'
                fi
              done \
            | jq -cs --argjson cap "$LAB_QUEUE_CAP" '.[0:$cap]' > lab-queue.json
          echo "lab queue: $(jq length lab-queue.json) release(s)"
          echo "releases=$(cat lab-queue.json)" >> "$GITHUB_OUTPUT"

  lab:
    needs: watch
    if: needs.watch.outputs.releases != '[]'
    runs-on: ubuntu-24.04
    environment: sandbox       # sandbox-only credentials for L3/L4; never live credentials
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        release: ${{ fromJson(needs.watch.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - run: java -cp app/target/czymogeaktualizowac.jar com.microsoft.playwright.CLI install --with-deps chromium
      - run: java -jar app/target/czymogeaktualizowac.jar lab prepare
      - name: Run profiles P1-P3 (solo), then P3 in the full stack
        env:
          # sandbox settings for L3, one secret per gateway (see config/plugins.json: sandboxEnvPrefix)
          LAB_SANDBOX_PAYNOW_OPTION_JSON: ${{ secrets.LAB_SANDBOX_PAYNOW_OPTION_JSON }}
          LAB_SANDBOX_PAYU_OPTION_JSON: ${{ secrets.LAB_SANDBOX_PAYU_OPTION_JSON }}
          SLUG: ${{ matrix.release.slug }}
          VERSION: ${{ matrix.release.version }}
          FORCE: ${{ matrix.release.force && '--force' || '' }}
        run: |
          java -jar app/target/czymogeaktualizowac.jar lab run --plugin "$SLUG" --version "$VERSION" --profiles P1,P2,P3 $FORCE
          java -jar app/target/czymogeaktualizowac.jar lab run --plugin "$SLUG" --version "$VERSION" --profiles P3 --mode stack $FORCE
      # Upload only this release's result file: the data checkout holds every older result too, and publish merges
      # all artifacts into one folder, so a stale copy from another job could overwrite a fresh result.
      - name: Stage this release's result
        env:
          SLUG: ${{ matrix.release.slug }}
          VERSION: ${{ matrix.release.version }}
        run: |
          mkdir -p "lab-out/$SLUG"
          cp "data/results/$SLUG/$VERSION.json" "lab-out/$SLUG/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.release.slug }}-${{ matrix.release.version }}
          path: lab-out

  publish:
    needs: [watch, lab]
    if: always() && needs.watch.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: data/results
          merge-multiple: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - name: Plan alerts against the last published state (drafts only until a mail provider is connected)
        run: java -jar app/target/czymogeaktualizowac.jar alerts
      - name: Build the site and record the published state
        run: java -jar app/target/czymogeaktualizowac.jar publish --mark-published
      - name: Commit data
        run: |
          cd data
          git config user.name "czymogeaktualizowac bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: results and published state $(date -u +%FT%TZ)"
          git push origin HEAD:data
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out
          # one name per attempt: a re-run keeps the earlier attempt's artifact and deploy-pages refuses duplicates
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
