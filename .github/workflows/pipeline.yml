# Door 1 pipeline: watch -> lab (one job per new release) -> publish (+ alert drafts).
# Runs on GitHub-hosted runners; free and unlimited for public repositories (verify current terms).
# Actions are pinned to commit SHAs (version in the trailing comment); bump SHA and comment together.
# Phase 0 TODO before going live: create the `sandbox` environment (deployments from main only,
# holds sandbox-only secrets).
name: pipeline

on:
  schedule:
    - cron: "17 4,16 * * *"   # twice a day
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also process the N previous releases of every plugin (history)"
        default: "0"
      retest:
        description: "Re-run the lab even if tested: comma-separated slug (latest release), slug@version, or all"
        default: ""

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # pushes the data branch
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the data branch (git is the database)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add data origin/data
          else
            git worktree add --orphan -b data data
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # with tests: a build that fails its tests never reaches the lab or the public site (lab/publish depend on watch)
      - run: mvn -B -q package
      - name: Validate config
        run: java -jar app/target/czymogeaktualizowac.jar validate
      - name: Watch WordPress.org
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '0' }}
        # exits non-zero only when no plugin at all could be read; errors of single plugins are warnings
        run: java -jar app/target/czymogeaktualizowac.jar watch --backfill "$BACKFILL"
      - name: Commit data
        run: |
          cd data
          git config user.name "czymogeaktualizowac bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: watch $(date -u +%FT%TZ)"
          git push origin HEAD:data
      # Lab queue: every known stable release the watcher verified (has a zipSha256) that has no lab result yet, then
      # releases whose stored result contains a lab ERROR (only those runs are repeated: `lab run` without --force skips
      # runs that completed). This covers new releases, the first-run baseline and backfilled history alike.
      # Order: forced retests, untested (newest release of each plugin first), ERROR retries; capped per run, the rest
      # is picked up by the next runs.
      # The `retest` input adds releases again, run with --force: `slug` (its latest release), `slug@version`, or `all`.
      - id: matrix
        env:
          LAB_QUEUE_CAP: "40"
          RETEST: ${{ github.event.inputs.retest || '' }}
        run: |
          RETEST_JSON=$(jq -cn --arg r "$RETEST" '$r | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          UNKNOWN=$(jq -r --argjson rt "$RETEST_JSON" '[.plugins[] | .slug as $s | $s, (.releases[] | select(.prerelease | not) | "\($s)@\(.version)")] as $known
                 | $rt - $known - ["all"] | join(",")' data/releases.json)
          if [ -n "$UNKNOWN" ]; then echo "::error::retest: unknown plugin or version: $UNKNOWN"; exit 1; fi
          jq -r --argjson rt "$RETEST_JSON" '.plugins[] | .slug as $s | .releases | map(select(.prerelease | not)) | to_entries[]
                 | select(.value.zipSha256 != null)
                 | .value.version as $v
                 | "\(.key)\t\($s)\t\($v)\t\(if (.key == 0 and ($rt | any(. == "all" or . == $s))) or ($rt | any(. == "\($s)@\($v)")) then 1 else 0 end)"' data/releases.json \
            | while IFS=$'\t' read -r rank slug version force; do
                f="data/results/$slug/$version.json"
                if [ "$force" = 1 ]; then prio=0
                elif [ ! -f "$f" ]; then prio=1
                elif jq -e '[.runs[].levels[].status] | index("ERROR")' "$f" >/dev/null; then prio=2
                else continue; fi
                printf '%s\t%s\t%s\t%s\t%s\n' "$prio" "$rank" "$slug" "$version" "$force"
              done \
            | sort -s -n -k1,1 -k2,2 \
            | while IFS=$'\t' read -r prio rank slug version force; do
                jq -cn --arg s "$slug" --arg v "$version" --argjson f "$force" '{slug: $s, version: $v, force: ($f == 1)}'
              done \
            | jq -cs --argjson cap "$LAB_QUEUE_CAP" '.[0:$cap]' > lab-queue.json
          echo "lab queue: $(jq length lab-queue.json) release(s)"
          echo "releases=$(cat lab-queue.json)" >> "$GITHUB_OUTPUT"

  lab:
    needs: watch
    if: needs.watch.outputs.releases != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: sandbox       # sandbox-only credentials for L3/L4; never live credentials
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        release: ${{ fromJson(needs.watch.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - run: java -cp app/target/czymogeaktualizowac.jar com.microsoft.playwright.CLI install --with-deps chromium
      - run: java -jar app/target/czymogeaktualizowac.jar lab prepare
      - name: Run profiles P1-P3 (solo), then P3 in the full stack
        env:
          # sandbox settings for L3, one secret per gateway (see config/plugins.json: sandboxEnvPrefix)
          LAB_SANDBOX_PAYNOW_OPTION_JSON: ${{ secrets.LAB_SANDBOX_PAYNOW_OPTION_JSON }}
          LAB_SANDBOX_PAYU_OPTION_JSON: ${{ secrets.LAB_SANDBOX_PAYU_OPTION_JSON }}
          SLUG: ${{ matrix.release.slug }}
          VERSION: ${{ matrix.release.version }}
          FORCE: ${{ matrix.release.force && '--force' || '' }}
        run: |
          java -jar app/target/czymogeaktualizowac.jar lab run --plugin "$SLUG" --version "$VERSION" --profiles P1,P2,P3 $FORCE
          java -jar app/target/czymogeaktualizowac.jar lab run --plugin "$SLUG" --version "$VERSION" --profiles P3 --mode stack $FORCE
      # Upload only this release's result file: the data checkout holds every older result too, and publish merges
      # all artifacts into one folder, so a stale copy from another job could overwrite a fresh result.
      # always(): runs that completed before a crash of the step are still kept (lab ERRORs no longer fail the step).
      - name: Stage this release's result
        if: always()
        env:
          SLUG: ${{ matrix.release.slug }}
          VERSION: ${{ matrix.release.version }}
        run: |
          mkdir -p "lab-out/$SLUG"
          if [ -f "data/results/$SLUG/$VERSION.json" ]; then
            cp "data/results/$SLUG/$VERSION.json" "lab-out/$SLUG/"
          else
            echo "::warning title=lab::no result written for $SLUG $VERSION"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.release.slug }}-${{ matrix.release.version }}
          path: lab-out
          if-no-files-found: ignore

  publish:
    needs: [watch, lab]
    if: always() && needs.watch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write            # one issue per release held by the embargo (GitHub e-mails you)
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: data/results
          merge-multiple: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      # drafts go to the data branch (committed below), so nothing is lost while no mail provider is connected;
      # publish --mark-published then moves the baseline on. Once a provider sends mail, advance the baseline only
      # after a successful send (see README "Not done").
      - name: Plan alerts against the last published state (drafts only until a mail provider is connected)
        run: java -jar app/target/czymogeaktualizowac.jar alerts --outbox data/outbox
      - name: Build the site and record the published state
        run: java -jar app/target/czymogeaktualizowac.jar publish --mark-published
      - name: Commit data
        run: |
          cd data
          git config user.name "czymogeaktualizowac bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: results and published state $(date -u +%FT%TZ)"
          git push origin HEAD:data
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out
          # one name per attempt: a re-run keeps the earlier attempt's artifact and deploy-pages refuses duplicates
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # A failing release is held back from the site, feeds and alerts (config/embargo.json). Each held release gets
      # one open issue labelled `embargo` (GitHub e-mails you once); the run itself stays green, so a red run always
      # means something is actually broken. Close the issue when you have decided.
      - name: Embargo - open an issue per held release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s out/embargo-held.txt ]; then echo "nothing held back"; exit 0; fi
          gh label create embargo --color B60205 --description "Failing lab result held back, decision needed" --force >/dev/null
          while IFS= read -r line; do
            echo "::warning title=Embargo::$line"
            key="${line%%:*}"   # "slug version"
            open=$(gh issue list --label embargo --state open --search "\"Embargo: $key\" in:title" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              printf '%s\n\n%s\n\n%s\n%s\n%s\n' "$line" "Lab log: $RUN_URL" \
                "- A lab problem: fix it and retest (Run workflow, retest: slug@version); a pass lifts the hold by itself." \
                "- A real failure: tell the vendor, then add {\"slug\", \"version\", \"decision\": \"publish\" or \"hold\", \"note\"} to config/embargo.json." \
                "- Without a decision the result is published automatically after holdDays." \
                | gh issue create --label embargo --title "Embargo: $key" --body-file -
            fi
          done < out/embargo-held.txt
