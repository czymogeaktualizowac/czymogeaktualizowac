# Quality gate for code changes: unit tests on every push and pull request to main.
# Make "test" a required status check in the branch protection of main so nothing untested is merged.
# The data pipeline (pipeline.yml) also runs the tests before it touches the lab or the site.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests and package
        run: mvn -B verify
      # unknown keys, wrong symbols ("lastest"), bad regexes, embargo decisions for untracked releases
      - name: Validate config
        run: java -jar app/target/czymogeaktualizowac.jar validate
